server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # REST/WebSocket을 같은 80번 포트 뒤로 감춰서, 이 한 포트만 열면 전체가 동작하게
    # 한다 (백엔드를 따로 공인 포트에 노출할 필요가 없고, CORS 문제도 아예 안 생긴다).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 라우팅 라이브러리 없이 window.location.pathname으로 직접 분기하는 SPA라,
    # /rooms/:id 같은 경로를 새로고침하면 서버에도 그 경로로 요청이 간다.
    # 실제 파일이 없으면 항상 index.html로 넘겨 클라이언트가 다시 분기하게 한다.
    location / {
        try_files $uri /index.html;
    }
}
